<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер расходов</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input { padding: .5rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    input[name=amount] { width: 110px; }
    input[name=category] { width: 150px; }
    input[name=description] { flex: 1; min-width: 150px; }
    button { padding: .5rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.delete { background: #dc2626; padding: .25rem .6rem; }
    button.delete:hover { background: #b91c1c; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #eee; }
    #error { color: #dc2626; min-height: 1.5rem; }
    #total { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Трекер расходов</h1>

  <form id="form">
    <input name="amount" type="number" step="0.01" placeholder="Сумма" required>
    <input name="category" placeholder="Категория" required>
    <input name="description" placeholder="Описание">
    <button type="submit">Добавить</button>
  </form>
  <div id="error"></div>

  <table>
    <thead>
      <tr><th>Дата</th><th>Категория</th><th>Сумма</th><th>Описание</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="total"></div>

  <script>
    const rows = document.getElementById("rows");
    const totalEl = document.getElementById("total");
    const errorEl = document.getElementById("error");
    const form = document.getElementById("form");

    async function loadExpenses() {
      const response = await fetch("/expenses");
      const expenses = await response.json();

      rows.innerHTML = "";
      let total = 0;

      for (const expense of expenses) {
        total += expense.amount;
        const tr = document.createElement("tr");

        const cells = [
          expense.date,
          expense.category,
          expense.amount.toFixed(2),
          expense.description || "",
        ];
        for (const value of cells) {
          const td = document.createElement("td");
          td.textContent = value;  // textContent защищает от вставки HTML
          tr.appendChild(td);
        }

        const actionTd = document.createElement("td");
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Удалить";
        deleteBtn.className = "delete";
        deleteBtn.addEventListener("click", () => deleteExpense(expense.id));
        actionTd.appendChild(deleteBtn);
        tr.appendChild(actionTd);

        rows.appendChild(tr);
      }

      totalEl.textContent = "Итого: " + total.toFixed(2);
    }

    async function deleteExpense(id) {
      await fetch("/expenses/" + id, { method: "DELETE" });
      loadExpenses();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";

      const data = new FormData(form);
      const body = {
        amount: parseFloat(data.get("amount")),
        category: data.get("category").trim(),
        description: data.get("description").trim() || null,
      };

      const response = await fetch("/expenses", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        errorEl.textContent = "Не удалось добавить расход: проверьте сумму и категорию.";
        return;
      }

      form.reset();
      loadExpenses();
    });

    loadExpenses();
  </script>
</body>
</html>
